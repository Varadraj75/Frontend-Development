<body>
    <!--Controls gives the access to play the audio -->
    <!-- in the poster we can add the thumbnail to the video-->
     <!--autoplay is to play the video automatically and we have to use muted -->

</br>
<!--preload is use to the load the data -->

</br>

<!--using iframe we can copy the content from any other website and use it in our website-->
<iframe src="./iframes.html" frameborder="1"></iframe>
<textarea name="" id="">Hhelllo buddy</textarea>
