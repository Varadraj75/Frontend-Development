<!-- PROMISE -->
 <!-- In PROMISE there are 3 stages -->
<!-- .then() -->
<!-- .catch() -->
<!-- .finally() -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function payment(){
            return new Promise(function(resolve,reject){
                let password = prompt("Enter PIN")
                if("hello"===password){
                    resolve ("Password is correct");
                }
                else{
                    reject ("Incorrect password")
                }
            })
        }
        function checkBalance(){
            return new Promise((resolve , reject)=>{
                setTimeout(()=>{
                    let balance = 3000;
                    if(balance>1000){
                        resolve ("Sufficient balance")
                    }
                    else{
                        reject ("Insufficient balance")
                    }
                })
            })
        }
        // console.log(payment());
        // payment().then(res=> console.log(res)).catch(err=> console.log(err)).finally(final=>console.log("Promise consumed "));
        payment().then((res)=> {
            console.log(res); 
            return checkBalance()
        }).then((res)=>{
            console.log(res);
    }).catch((err)=>console.log(err));
    </script>
</body>
</html>
