<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>Current Time</h3>
    <p>00:00:00</p>
    <script>
        const p_tag = document.querySelector("p")
        
        
        setInterval(function(){
        let date = new Date();
        let hours = date.getHours();
        let minutes = date.getMinutes();
        let secounds = date.getSeconds();
        p_tag.innerHTML = `${hours}:${minutes}:${secounds}`
        },1000)
       
    </script>
</body>
</html>
