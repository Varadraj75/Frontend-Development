<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: black;
        }
        .rado{
            height: 500px;
            width: 500px;
            border-radius: 50%;
            
            border: 1px solid whitesmoke;
            border-style: dotted;
            position: absolute;
            top: 30%;
            left: 40%;
           
            animation:move  3s  infinite linear ;
        }
        .sun{
            background-color: yellow;
            height: 250px;
            width: 250px;
            border-radius: 50%;
            position: absolute;
            top: 185px;
            left: 48%;
            box-shadow: 0 0 15px 5px rgba(238, 255, 7, 0.7);
        }
        .smallradi{
            height: 100px;
            width: 100px;
            border-radius: 50%;
            border: 1px solid whitesmoke;
            border-style: dotted;
            position: absolute;
            top: 89%;
            left: 40%;
            
            
        }
        .earth{
            height: 50px;
            width: 50px;
            border-radius: 50%;
            background-color: blue;
            position: absolute;
            top: 4%;
            left: 24%;
            
        }
        @keyframes move{
            0%{
                transform: rotate(0deg);
            }
            100%{
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="sun"></div>
    <div class="rado">
    
    <div class="smallradi">
        <div class="earth"></div>
    </div>
    </div>
</body>
</html>
