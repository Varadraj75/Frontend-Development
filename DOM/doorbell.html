<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button>Door bell</button>
    <button class="dar">Dark theme</button>
    <script>
        const doorBell = new Audio("doorbell.mp3")
        const btn = document.querySelector("button")
        btn.addEventListener('click',opendoor)
        function opendoor(){
            doorBell.play();
            console.log("Opening Door.....")
        }
        const dark = document.querySelector(".dar")
        dark.addEventListener('click',darkk)
        function darkk(){
            document.body.style.backgroundColor="black"
        }
    </script>
</body>
</html>
