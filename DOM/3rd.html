<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <img src="https://thumbs.dreamstime.com/b/r-214795388.jpg" alt="click me image">
    <input type="text">
    <script>
        const btn = document.querySelector("img");
        const input = document.querySelector("input")
        const messageElement = document.createElement("strong")
        input.addEventListener("input",function(e){
            
            const username =(e.target.value);
            if(username.length<4 & username.length!==0){
                
                messageElement.innerText="Username Should exceed 4 digits"
                document.body.append(messageElement)
            }
            else{
                messageElement.innerText=""
            }
        })
    </script>
</body>
</html>
