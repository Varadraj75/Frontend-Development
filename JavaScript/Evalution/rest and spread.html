<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // the spread operator(...) is used to expand or spread elements from an iterable(such as an array,string or object) into individual elements.
        // use to spread operators -> copying an array , merging an array, passing multiple arguments to a function
        const array=[1,2,3,];
        console.log(...array)
        const ar = [4,5]
        console.log(...array,...ar);

        const numbers = [1,2,3,4,5,6]
        sum(...numbers);
        function sum(a,b,c,d,e){
            console.log(a+b+c+d+e)
        }

        // Rest operator -> packing
        // the rest operator is used in function parameters to collect all remaining arguments into an array.
        function display(first,second,...restarguments){
            console.log(first)
            console.log(second)

            console.log(restarguments)
        }
        display(1,2,3,4,5)
    </script>
</body>
</html>
