<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text-Shadow and Box-shadow</title>
    <style>
        h1{
            /* first is x axis  , second is y axis ,third is  transparency  */
            text-shadow: 5px 5px 12px grey , 0px -5px 5px red;
            
        }
        h1:hover{
            box-shadow: 5px 5px 5px black;
        }
    </style>
</head>
<body>
    <h1>Welcome to my website</h1>
</body>
</html>
