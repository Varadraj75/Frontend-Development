<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Using Pseudo_classes</title>
    <style>
        a:link{
            color: lawngreen;
        }
        a:visited{
            color: gray;
        }
        a:hover{
            color: tomato;
        }
        a:active{
            color: violet;
        }
        button:hover{
            background-color: lightgreen;
        }
        button:active{
            background-color: white;
        }
        /* li:nth-child(5){
            background-color: yellowgreen;
        } */
         li:nth-child(even){
            background-color: aqua;
         }
         li:nth-child(odd){
            background-color: aquamarine;
         }
    </style>
</head>
<body>
    <a href="https://www.google.com">Google here!</a>
    <button >click me</button>
    <ul>
        <li>This is element #1</li>
        <li>This is element #2</li>
        <li>This is element #3</li>
        <li>This is element #4</li>
        <li>This is element #5</li>
        <li>This is element #6</li>
        <li>This is element #7</li>
        <li>This is element #8</li>
        <li>This is element #9</li>
        <li>This is element #10</li>
        <li>This is element #11</li>
    </ul>
</body>
</html>
