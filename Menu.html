<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0%;
            padding: 0%;
        }
        header{
            background-color: black;
            color: white;
            display: flex;
            height: 5vh;
            align-items: center;
        }
        a{
            text-decoration: none;
            color: white;
            font-family: cursive;
            font-size: 1.5rem;
        }
        h1{
            flex-grow: 3;
        }
        nav{
            display: flex;
            justify-content: space-evenly;
            flex-grow: 1;
        }
        a:hover{
            color: rgb(19, 252, 58);
            cursor: pointer;
        }
        
        span{
            height: 3px;
            width: 20px;
            background-color: whitesmoke;
            display: block;
            margin: 3px;
            
        }
        label{
            display: none;
        }
        input{
            display: none;
        }
        @media screen and (max-width:600px) {
            h1{
                font-size: 30px;
            }
            nav{
                position: absolute;
                top: 5vh;
                background-color: black;
                color: whitesmoke;
                display: flex;
                flex-direction: column;
                width: 100%;
                text-align: center;
            }
            label{
                display: block;
            }
            nav{
                display: none;
            }
            input:checked~ nav{
                display: flex;
            }

            
        }
    </style>
</head>
<body>
    <header>
        <h1>My website</h1>
        <label for="nav-btn">
            <span></span>
            <span></span>
            <span></span>
        </label>
        <input type="checkbox" id="nav-btn">
        <nav>
            <a href="#">Home</a>
            <a href="#">Service</a>
            <a href="#">Account</a>
            <a href="#">Login</a>
        </nav>
    </header>
</body>
</html>
