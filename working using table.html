<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Using Table</title>
</head>
<body>
    <table border="1">
        <thead>
            <tr>
                <th >Time slot</th>
                <th colspan="2">Day 1</th>
                <th colspan="2">Day2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>7:00 A.M.</td>
                <td>Session 1</td>
                <td>Session 2</td>
                <td>Session 3</td>
                <td>session 4</td>
            </tr>
            
        </tbody>
        <tfoot>
            <tr>
                <td>9:00 A.M.</td>
                <td>Keynote</td>
                <td>Workshop</td>
                <td>panel</td>
                <td>networking</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
