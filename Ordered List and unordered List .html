<!DOCTYPE html>
<html>
    <head>
        <title>Ordered list and unordered list </title>
    </head>
    <body>
        <!--type are circle , square , disk , null -->
        <ul type="circle">
            <li>Varad</li>
            <li>Rahul</li>
            <li>Mohan</li>
            <li>sohan</li>
        </ul>
    </br>
    <!--Type 1 , A , i , I   -->
    <!--start tells us about from where to start from-->
    <!-- in reversed numbering will be done from bottom-->
        <ol type="A" start="3" reversed>
            <li>Sahil</li>
            <li>roha</li>
            <li>shah</li>
            <li>Ram</li>
            <li>Shyam</li>
        </ol>
    </br>
    <p> some of my skills</p>
    <ol>
        <li>I know html</li>
        <li>I know css</li>
        <li>i know js</li>
    </ol>

    
    </body>
</html>
