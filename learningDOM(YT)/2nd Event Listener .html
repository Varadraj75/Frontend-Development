<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1 id="main-heading">Event Listners</h1>
    <div class="container">
      <div class="boxes box-1">
        <h1 id="heading">Example 1</h1>
        <!-- <button onclick="alert('I love js')">Enter</button> -->
         <button>Enter</button>
      </div>
      <div class="boxes box-2">
        <h1 id="heading">Example 2</h1>
        <button class="btn-2">Enter</button>
      </div>
      <div class="boxes box-3">
        <h1 id="heading">Example 3</h1>
        <button class="btn-3">Enter</button>
      </div>
    </div>
    <script>
        // event listner on click
  const buttonTwo = document.querySelector(".btn-2");

  function alertBTN() {
    alert("I love java");
  }

  buttonTwo.addEventListener("click", alertBTN);
  // MOUSEOVER
  const newBackgroundColor = document.querySelector(".box-3")
  function bgcolor(){
    newBackgroundColor.style.backgroundColor = "blue"
  }
  newBackgroundColor.addEventListener("mouseover",bgcolor)
</script>
  </body>
</html>
