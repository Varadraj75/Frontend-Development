<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>SUbscript and superscript</title>

    </head>
    <body>
        <!--using super script-->
        <p>e<sup>x</sup></p>
    </br>
    <!--using sub script-->
    <p><sub>e</sub>x</p>
    </body>
</html>
