<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Varad Raj Agrawal">
    <title>Mobile response</title>
    <style>
        header{
            background-color: black;
            display: flex;
            height: 5vh;
            align-items: center;
        }
        h2{
            color: white;
            align-items: center;
            flex-grow: 3;
        }
        a{
            text-decoration: none;
            color: white;
            font-family: cursive;
            font-size: 1.5rem;
        }
        nav{
            display: flex;
            justify-content: space-evenly;
            flex-grow: 1;
        }
        a:hover{
            color: greenyellow;
        }
        span{
            height: 3px;
            width: 20px;
            background-color: whitesmoke;
            display: block;
            margin: 3px;
        }
        label{
            display: none;
        }
        input{
            display: none;
        }
        @media(max-width:600px){
            h2{
                font-size: 50px;
            }
            nav{
                position: absolute;
                top: 5vh;
                background-color: black;
                color: whitesmoke;
                display: flex;
                flex-direction: column;
                width: 100%;
                text-align: center;
            }
            label{
                display: block;
            }
            nav{
                display: none;
            }
            input:checked~nav{
                display: flex;
            }
        }

    </style>
</head>
<body>
    <header>
        <h2>My website</h2>
        <label for="Nav">
            <span></span><span></span><span></span>
        </label>
        <input type="checkbox" id="Nav">
        <nav>
            <a href="">Shopping</a>
            <a href="">None</a>
            <a href="">About</a>
            <a href="">Contacts</a>
        </nav>
    </header>
</body>
</html>
