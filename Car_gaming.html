<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0%;
            padding: 0%;
        }
        body{
            height: 100vh;
            background-color: rgb(76, 225, 225);
            display: flex;
            flex-direction: column;
            justify-content: end;
            overflow: hidden;
        }
        .road{
            background-color: rgb(45, 45, 45);
            height: 30vh;
            position: absolute;
            bottom: 0;
            width: 100%;
        }
        .car{
            height: 60px;
            width: 150px;
            background-color: rgb(255, 0, 0);
            position: absolute;
            bottom: 100px;
            border-radius: 10%;
            animation: move 4s linear infinite ;
        }
        .wheelleft{
            height: 40px;
            width: 40px;
            border-radius: 50%;
            background-color: black;
            position: absolute;
            top: 45px;
            left: 7px;
        }
        .wheelright{
            height: 40px;
            width: 40px;
            border-radius: 50%;
            background-color: black;
            position: absolute;
            left: 95px;
            top: 45px;
        }
        @keyframes move{
            from{
                left: -150px;
            }
            to{
                left: 100vw;
            }
        }
    </style>
</head>
<body>
    <div class="road">
        <div class="car">
            <div class="wheelleft"></div>
            <div class="wheelright"></div>
        </div>
    </div>

</body>
</html>
