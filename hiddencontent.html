<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0%;
            padding: 0%;
        }
        p{
           
            text-align: end;
            transition-property: color;
            opacity: 0;
        }
        p:hover{
            height: 100px;
            width: 100px;
            opacity: 1;
            color: rgb(246, 18, 18);
            transform: translateX(-1550px);
            transition: 5s;
        }
    </style>
</head>
<body>
    <p>Hi this is me varad</p>
</body>
</html>
