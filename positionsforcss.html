<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>positions_for_css</title>
    <style>
        *{
            margin: 0%;
            padding: 0%;
            box-sizing: border-box;
        }
        .container{
            background-color: aqua;
            height: 100vh;
            width: 200px;
            position: relative;
            /* top: 50%;
            left: 50%;
            transform: translate(-50% , -50%); */
        }
        .container>div{
            height: 200px;
            width: 200px;
        }
        .card1{
            background-color: brown;
            position: absolute;
            left: 50px;
        }
        .card2{
            background-color: rgb(249, 109, 109);
            position: absolute;
            left: 100%;
            transform: translateX(-100%);

        }
        .card3{
            background-color: rgb(214, 104, 188);
            position: absolute;
        }
        .card4{
            background-color: rgb(255, 64, 249);
            position: absolute;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card1">card 1</div>
        <div class="card2">card 2</div>
        <div class="card3">card 3</div>
        <div class="card4">card 4</div>
    </div>
</body>
</html>
